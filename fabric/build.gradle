plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"
}

loom {
    accessWidenerPath = file('src/main/resources/growling_man.accesswidener')
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
    runs {
        client {
            client()
            runDir('run')
        }
        server {
            server()
            runDir('run')
        }
        // tools/scenetest.sh LOADER=fabric
        scene {
            client()
            name 'Scene'
            vmArg "-Dgrowling_man.scene=${project.findProperty('scene') ?: 'true'}"
            runDir('run')
        }
        // tools/nettest.sh LOADER=fabric
        netServer {
            server()
            name 'NetServer'
            runDir('run-net')
        }
        netClient {
            client()
            name 'NetClient'
            vmArg '-Dgrowling_man.netscene=true'
            programArgs '--quickPlayMultiplayer', 'localhost:25565', '--username', 'Dev'
            runDir('run')
        }
        // tools/perf.sh LOADER=fabric
        perf {
            client()
            name 'Perf'
            vmArg '-Dgrowling_man.perf=true'
            if (project.hasProperty('jfr')) {
                vmArg '-XX:StartFlightRecording=filename=perf.jfr,settings=profile'
            }
            runDir('run')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xmaxerrs', '100000']
}

// The release jar on a production (intermediary-mapped) Fabric server with Fabric API and GeckoLib
configurations {
    productionMods { transitive = false }
}
dependencies {
    productionMods "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    productionMods "software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"
}
def prodDir = file('run-prod')
tasks.register('prodServer', net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    dependsOn remapJar
    mods.from(remapJar.archiveFile)
    mods.from(configurations.productionMods)
    runDir = prodDir
    timeout = java.time.Duration.ofMinutes(5)
    doFirst {
        new File(prodDir, 'world').deleteDir()
        new File(prodDir, 'config').deleteDir()
        prodDir.mkdirs()
        new File(prodDir, 'eula.txt').text = 'eula=true\n'
    }
}
